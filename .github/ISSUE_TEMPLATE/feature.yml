name: Feature / backlog item
description: A concrete unit of implementation work — from the DESIGN.md roadmap or a new capability.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        This issue must be usable by someone who has never seen any conversation about it —
        see `.claude/skills/issue-authoring/SKILL.md` for the exact standard.
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: What should exist and why? Write for a reader with no context beyond this repo.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Specific sections, not "see the design doc".
      placeholder: |
        - DESIGN.md §3.1
        - docs/engineering/concurrency-performance.md §1
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify literally against the diff.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - area:core
        - area:layout
        - area:win32
        - area:daemon
        - area:cli
        - area:bar
        - area:ipc
        - area:ci
        - area:docs
    validations:
      required: true
